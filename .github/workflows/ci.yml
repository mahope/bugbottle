name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:docs
      - name: dist is committed and current
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ differs from the build. Run npm run build and git add -f dist before pushing." >&2
            git diff --stat -- dist >&2
            exit 1
          fi
      - run: npm pack --dry-run

  bundle:
    name: Bundles without html-to-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The IIFE is already in dist/ after the build — esbuild made it there —
      # so it only has to be weighed, not bundled again.
      - name: The one-script-tag bundle stays under its budget
        run: |
          set -e
          iife=$(gzip -c dist/bugbottle.js | wc -c)
          echo "dist/bugbottle.js: $iife bytes gzipped"
          # 16.1 kB before the accessibility pass, 16.8 after it, about 17.7 with
          # the stack frames and the wider context: the script tag carries every
          # default in eight languages.
          # 18432 was not enough for the picture annotator, which is why the
          # budget was 20992. About 1.4 kB of the rise is `src/annotate.ts`
          # itself and the remaining kilobyte is its eight locale strings in
          # eight languages — one of them a sentence, because it is where the
          # annotator's keys are said to a screen reader. Neither half can be
          # dropped without dropping the feature or its accessible names. The
          # panel takes the annotator as an option now, but this build is the
          # one that carries everything and hands it in, so the budget cannot
          # come down: it went up by the twenty-odd bytes of that wiring. Signing
          # (#37) landed beside it; the two together measure about 21.1 kB, so the
          # budget is 21504.
          # Measure before writing a budget down: #36 recorded 20450 for a file
          # that gzips to 21042 with the pinned esbuild, so this job was red on
          # main until the number was corrected.
          # `bugbottle/perf` (#42) then added about 1.08 kB — the whole module,
          # since the script tag carries every recorder it can switch on — and
          # #48's longer keyboard sentence in eight languages about 300 bytes more;
          # the file measured 22501, so the budget was 23040. The snapshot is
          # still opt-in at run time behind `data-perf`, exactly as the network log.
          # `bugbottle/shake` (#43) then added 572 bytes: the module gzips to
          # 685 on its own and to rather less inside a bundle it can share a
          # dictionary with, plus the `data-shake` reading and
          # `requestShakePermission` on the namespace — which this build has to
          # expose, because a page with no bundler has no other way to ask iOS
          # for the permission. The file measures 23073, so the budget is 23552.
          # No locale string was added: a shake opens the panel the reporter
          # already knows, and says nothing of its own.
          # The optional contact field (#51) then added 767 bytes and took the
          # budget to 24576. Two thirds of that is text: three locale strings —
          # a label, a hint and the refusal a required field shows — in eight
          # languages, which this build carries all of. The rest is the panel's
          # own half of the field and the `data-contact` reading, which is the
          # only way a page with no bundler can ask for it. The file measures
          # 23839, and 23989 since #58 moved the `data-*` reading into
          # `src/global-shared.ts` so the slim build could share it: 52 bytes
          # for a module boundary and the one optional call the shared boot
          # takes. The budget did not move.
          if [ "$iife" -gt 24576 ]; then
            echo "dist/bugbottle.js is $iife bytes gzipped; the budget is 24576" >&2
            exit 1
          fi
      - name: The slim script-tag bundle stays under its budget
        run: |
          set -e
          slim=$(gzip -c dist/bugbottle.slim.js | wc -c)
          echo "dist/bugbottle.slim.js: $slim bytes gzipped"
          # The same panel without the annotator, the timings snapshot, the
          # shake gesture and the network log. #58 aimed at 18432 and the file
          # measures 20477, so the budget is 20992 — measure before writing a
          # budget down, as the full build's history above says twice.
          # 18 kB was never reachable while keeping the eight locales: of the
          # 55 kB minified, `src/locales.ts` is 16.5 kB and `src/ui/index.ts`
          # is 15.9 kB, and neither shrinks by dropping a recorder. What the
          # four modules cost the full build is what came off: 23989 - 20477 =
          # 3512 bytes, rather less than their 4.5 kB standalone sum, because
          # inside one bundle they share gzip's dictionary. Two of their costs
          # stay behind on purpose — the annotator's eight locale strings in
          # eight languages, which are data, and the panel's own annotator
          # toolbar, which is a static import.
          if [ "$slim" -gt 20992 ]; then
            echo "dist/bugbottle.slim.js is $slim bytes gzipped; the budget is 20992" >&2
            exit 1
          fi
      - run: npm pack --pack-destination /tmp
      - name: Install the tarball in a project that has no html-to-image
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm i --silent /tmp/bugbottle-*.tgz esbuild@0.24.0
          echo 'import { initConsoleBuffer, buildReport } from "bugbottle"; initConsoleBuffer(); buildReport({ type: "bug", message: "x" });' > core.js
          echo 'import { useBugReport } from "bugbottle/react"; export { useBugReport };' > react.js
          echo 'import { useBugReport } from "bugbottle/vue"; export { useBugReport };' > vue.js
          echo 'import { createBugReport } from "bugbottle/svelte"; export { createBugReport };' > svelte.js
          echo 'import { createBugReport } from "bugbottle/solid"; export { createBugReport };' > solid.js
          echo 'import { buildReport, sendReport, captureScreenshot, pickElement } from "bugbottle"; export { buildReport, sendReport, captureScreenshot, pickElement };' > form-core.js
          echo 'import { normaliseConsole } from "bugbottle/server"; export { normaliseConsole };' > server.js
          echo 'import { mountBugbottle } from "bugbottle/ui"; export { mountBugbottle };' > ui.js
          echo 'import { createAnnotator } from "bugbottle/annotate"; export { createAnnotator };' > annotate.js
          echo 'import { initBreadcrumbs } from "bugbottle/breadcrumbs"; initBreadcrumbs();' > breadcrumbs.js
          echo 'import { initNetwork } from "bugbottle/network"; initNetwork();' > network.js
          echo 'import { initPerf } from "bugbottle/perf"; initPerf();' > perf.js
          echo 'import { createQueue } from "bugbottle/queue"; export { createQueue };' > queue.js
          echo 'import { onShortcut, onUncaughtError } from "bugbottle/triggers"; export { onShortcut, onUncaughtError };' > triggers.js
          echo 'import { onShake, requestShakePermission } from "bugbottle/shake"; export { onShake, requestShakePermission };' > shake.js
          echo 'import { createSigner } from "bugbottle/sign"; export { createSigner };' > sign.js
          echo 'import { attachRrweb } from "bugbottle/rrweb"; export { attachRrweb };' > rrweb.js
      - name: Bundle each entry and report gzipped sizes
        working-directory: /tmp/consumer
        run: |
          set -e
          npx esbuild core.js --bundle --minify --format=esm --outfile=out-core.js
          npx esbuild react.js --bundle --minify --format=esm --external:react --outfile=out-react.js
          npx esbuild vue.js --bundle --minify --format=esm --external:vue --outfile=out-vue.js
          npx esbuild svelte.js --bundle --minify --format=esm --outfile=out-svelte.js
          npx esbuild solid.js --bundle --minify --format=esm --external:solid-js --outfile=out-solid.js
          npx esbuild form-core.js --bundle --minify --format=esm --outfile=out-form-core.js
          npx esbuild server.js --bundle --minify --format=esm --platform=node --outfile=out-server.js
          npx esbuild ui.js --bundle --minify --format=esm --outfile=out-ui.js
          npx esbuild annotate.js --bundle --minify --format=esm --outfile=out-annotate.js
          npx esbuild breadcrumbs.js --bundle --minify --format=esm --outfile=out-breadcrumbs.js
          npx esbuild network.js --bundle --minify --format=esm --outfile=out-network.js
          npx esbuild perf.js --bundle --minify --format=esm --outfile=out-perf.js
          npx esbuild queue.js --bundle --minify --format=esm --outfile=out-queue.js
          npx esbuild triggers.js --bundle --minify --format=esm --outfile=out-triggers.js
          npx esbuild shake.js --bundle --minify --format=esm --outfile=out-shake.js
          npx esbuild sign.js --bundle --minify --format=esm --outfile=out-sign.js
          npx esbuild rrweb.js --bundle --minify --format=esm --outfile=out-rrweb.js
          for f in out-core out-react out-vue out-svelte out-solid out-form-core out-server out-ui out-annotate out-breadcrumbs out-network out-perf out-queue out-triggers out-shake out-sign out-rrweb; do
            echo "$f: $(gzip -c $f.js | wc -c) bytes gzipped"
          done
          core=$(gzip -c out-core.js | wc -c)
          react=$(gzip -c out-react.js | wc -c)
          ui=$(gzip -c out-ui.js | wc -c)
          # The bare core must not carry the scrubber, or anything else added
          # to the entry that a plain buildReport consumer never calls.
          # 0.9 kB of this is the buffer and buildReport as they shipped in 0.5;
          # the rest is the evidence added in 0.6 — the stack parser in
          # `src/stack.ts` (about 250 bytes) and the six optional context facts
          # (about 190). Splitting the parser out does not make the core any
          # smaller, because `console-buffer.ts` is itself part of this entry;
          # it keeps the parsing out of `report-core.ts`, which the server
          # imports. Both are on by default, so the budget carries them.
          # #42 added 38 bytes to this number and not one byte more: the core
          # entry gained the two registry reads that pick up a perf and a
          # storage snapshot (1272 → 1310), and carries none of
          # `src/perf.ts` — the observers, the store walk and the cookie parse
          # are in `bugbottle/perf` and are bundled only by an application that
          # imports it. That is the seam this budget exists to guard.
          # #55 added 19 more bytes for the same reason and in the same shape:
          # one registry read for the rrweb buffer (1316 -> 1335 measured
          # locally). None of `src/rrweb.ts` is here — the adapter, the rolling
          # buffer and the byte cap are in `bugbottle/rrweb` and are bundled
          # only by an application that imports it and hands rrweb's own
          # `record` in.
          if [ "$core" -gt 1536 ]; then
            echo "bugbottle is $core bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
          breadcrumbs=$(gzip -c out-breadcrumbs.js | wc -c)
          # 4.5 kB of this is the hook and its dependencies; the 0.65 kB that
          # took it past the old 4 kB budget is screenshot masking, which the
          # hook pays for whether or not it takes pictures because it is on by
          # default. A privacy default that a consumer has to remember to
          # import is not a default at all. The `queued` state and its message
          # then took it just over 5 kB, which is why the budget is 5.25.
          # 0.6 kB was added in 0.6 by the stack frames and the context facts,
          # which the hook pays for because the core does.
          # The contact field (#51) and the replay registry read (#55) then took it
          # to 5647, fifteen bytes over 5632, so the budget is 6144: the hook
          # carries every core default, and two of them landed in one release.
          if [ "$react" -gt 6144 ]; then
            echo "bugbottle/react is $react bytes gzipped; the budget is 6144" >&2
            exit 1
          fi
          # 8.0 kB of this is the panel as it shipped in 0.5; the kilobyte on
          # top is `bugbottle/triggers`, which the panel now imports so that a
          # keyboard shortcut works without any wiring. An application that
          # mounts the panel gets both, so it is budgeted for both. The budget
          # then went from 9 kB to 10 kB for the accessibility pass — the focus
          # trap and return, the radio group with its arrow keys, the live
          # region, the two-scheme colours and five new strings — which is the
          # difference between a panel a keyboard user can leave and one they
          # cannot, and so is not optional.
          # The budget then went from 10 kB to 12 kB for the picture annotator,
          # which the panel imported unconditionally, and came back to 11 kB
          # when it stopped: `annotate` is a function you hand in, like
          # `screenshot`, `scrub` and `sign`, so `src/annotate.ts` — 1441 bytes
          # gzipped — is in the bundle only for the applications that ask for
          # it. What stays behind is the panel's own half of the feature: the
          # toolbar markup, its CSS, the open/close wiring and the eight
          # English strings, about 720 bytes measured against the 10 229 the
          # panel weighed before the annotator existed. Those cannot be
          # tree-shaken — a static import is a static import — so 10 kB is not
          # reachable again without dropping the feature, and a dynamic import
          # would only move the cost onto a network round trip in the middle of
          # a report.
          # #43 added 94 bytes to this number (10 997 -> 11 091): the shake
          # detector is a function handed in like `annotate`, so the panel
          # carries the wiring and never the module.
          # #51 added 256 bytes (11 086 -> 11 342) and took the budget to
          # 11776: the optional contact field is an input, a label, a hint and
          # the required check that refuses a submit, plus its three English
          # strings. It is off by default and the markup is static, so the
          # bytes are paid by every panel; a field nobody switches on is a
          # hidden input and three strings, which is the cheapest shape this
          # can take without a second entry point for one input.
          if [ "$ui" -gt 11776 ]; then
            echo "bugbottle/ui is $ui bytes gzipped; the budget is 11776" >&2
            exit 1
          fi
          # The annotator on its own: a canvas, three tools, an undo stack and
          # no dependency. 1441 bytes gzipped when it landed, against the
          # 2048-byte budget the roadmap set for it.
          annotate=$(gzip -c out-annotate.js | wc -c)
          if [ "$annotate" -gt 2048 ]; then
            echo "bugbottle/annotate is $annotate bytes gzipped; the budget is 2048" >&2
            exit 1
          fi
          # The breadcrumbs module itself is well under 1 kB; the rest of this
          # number is `buildSelector`, which is 471 bytes gzipped on its own and
          # is shared with the core in any app that also points at elements —
          # adding breadcrumbs to such an app costs about 550 bytes gzipped.
          if [ "$breadcrumbs" -gt 1536 ]; then
            echo "bugbottle/breadcrumbs is $breadcrumbs bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
          # The network log carries its own URL scrubber, which is the query
          # pattern from scrub.ts and nothing else; the rest of the scrubber is
          # tree-shaken away. 1174 bytes gzipped when it landed; about 100 bytes
          # more once a reused XMLHttpRequest stopped recording itself twice and
          # a reset stopped uninstalling other people's wrappers, which is a
          # cheap price for entries that are neither duplicated nor stolen.
          network=$(gzip -c out-network.js | wc -c)
          if [ "$network" -gt 1330 ]; then
            echo "bugbottle/network is $network bytes gzipped; the budget is 1330" >&2
            exit 1
          fi
          # The timings and the storage snapshot. It imports nothing but four
          # constants from report-core, so this number is very nearly the
          # module itself: five observers, the navigation entry, two store
          # walks and a cookie parse. 1236 bytes gzipped when it landed,
          # against the 1280-byte budget the issue set for it.
          perf=$(gzip -c out-perf.js | wc -c)
          if [ "$perf" -gt 1280 ]; then
            echo "bugbottle/perf is $perf bytes gzipped; the budget is 1280" >&2
            exit 1
          fi
          # The queue imports nothing but a type, so this number is the module
          # itself: storage, backoff, the listeners and one fetch. It was 986
          # bytes against a 1 kB budget until two tabs sharing one localStorage
          # were taken seriously: every write now re-reads and merges by item
          # id, and a report is claimed before it goes out. That is a
          # read-modify-write, a claim and a release where there used to be one
          # setItem, and it is what stops a second tab losing, duplicating or
          # resurrecting reports.
          queue=$(gzip -c out-queue.js | wc -c)
          if [ "$queue" -gt 1330 ]; then
            echo "bugbottle/queue is $queue bytes gzipped; the budget is 1330" >&2
            exit 1
          fi
          # Two listeners, a shortcut parser and the shared fingerprint hash.
          # The roadmap aimed at 1 kB; it lands at 1133 because the module is
          # small enough that gzip has nothing to share — 2.3 kB of dense
          # minified code compresses at about half, and every part of it (the
          # `mod` platform split, the editable-target check, the two event
          # shapes, the dedupe map) is behaviour the panel relies on. It still
          # imports nothing but the fingerprint hash, which is what the budget
          # is really guarding. 1300 rather than 1200 since the shortcut learnt
          # about shadow roots: the composed path of the event and the focus
          # chain through `shadowRoot.activeElement`, without which the panel's
          # own textarea ate the shortcut it was typing into.
          triggers=$(gzip -c out-triggers.js | wc -c)
          if [ "$triggers" -gt 1300 ]; then
            echo "bugbottle/triggers is $triggers bytes gzipped; the budget is 1300" >&2
            exit 1
          fi
          # The shake detector: one listener, a high-pass filter over three
          # axes and the permission call iOS needs. It imports nothing but a
          # type, so this number is the module itself. It is its own entry
          # rather than a third function in `bugbottle/triggers`, which measures
          # within twenty bytes of its own budget — and a phone gesture is not
          # something a desktop application should be made to carry.
          shake=$(gzip -c out-shake.js | wc -c)
          if [ "$shake" -gt 768 ]; then
            echo "bugbottle/shake is $shake bytes gzipped; the budget is 768" >&2
            exit 1
          fi
          # The rrweb adapter: the rolling buffer, the checkout trim and the
          # byte cap. It imports two types and nothing at run time — rrweb
          # itself is the application's, handed in as `record` — so this number
          # is the module. 711 bytes gzipped when it landed, against the
          # 768-byte budget the issue set for it.
          rrweb=$(gzip -c out-rrweb.js | wc -c)
          if [ "$rrweb" -gt 768 ]; then
            echo "bugbottle/rrweb is $rrweb bytes gzipped; the budget is 768" >&2
            exit 1
          fi
          # One key import, one HMAC and a hex loop, and it imports nothing at
          # all — so this number is the module itself. The core must not carry
          # it: `sendReport` takes the signer as a function for the same reason
          # it takes the scrubber as one.
          sign=$(gzip -c out-sign.js | wc -c)
          if [ "$sign" -gt 512 ]; then
            echo "bugbottle/sign is $sign bytes gzipped; the budget is 512" >&2
            exit 1
          fi
          # The three adapters are budgeted on what they add, not on what they
          # weigh: a `bugbottle/vue` bundle is about 5.2 kB, and nearly all of
          # it is the capture, the picker and the send that any form pays for
          # whichever framework renders it. `form-core.js` imports exactly that
          # much of the core, so the difference is the adapter and the state
          # machine underneath it — 1315 bytes for Vue and 1186 for Svelte when
          # they landed, and 1270 for Solid, against the same 1536-byte
          # budget the other small entries get.
          formcore=$(gzip -c out-form-core.js | wc -c)
          vue=$(( $(gzip -c out-vue.js | wc -c) - formcore ))
          svelte=$(( $(gzip -c out-svelte.js | wc -c) - formcore ))
          solid=$(( $(gzip -c out-solid.js | wc -c) - formcore ))
          echo "bugbottle/vue adds $vue bytes gzipped over the shared core"
          echo "bugbottle/svelte adds $svelte bytes gzipped over the shared core"
          echo "bugbottle/solid adds $solid bytes gzipped over the shared core"
          if [ "$vue" -gt 1536 ]; then
            echo "bugbottle/vue adds $vue bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
          if [ "$svelte" -gt 1536 ]; then
            echo "bugbottle/svelte adds $svelte bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
          if [ "$solid" -gt 1536 ]; then
            echo "bugbottle/solid adds $solid bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
