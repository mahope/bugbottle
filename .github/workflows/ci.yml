name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  bundle:
    name: Bundles without html-to-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - name: Install the tarball in a project that has no html-to-image
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm i --silent /tmp/bugbottle-*.tgz esbuild@0.24.0
          echo 'import { initConsoleBuffer, buildReport } from "bugbottle"; initConsoleBuffer(); buildReport({ type: "bug", message: "x" });' > core.js
          echo 'import { useBugReport } from "bugbottle/react"; export { useBugReport };' > react.js
          echo 'import { normaliseConsole } from "bugbottle/server"; export { normaliseConsole };' > server.js
          echo 'import { mountBugbottle } from "bugbottle/ui"; export { mountBugbottle };' > ui.js
          echo 'import { initBreadcrumbs } from "bugbottle/breadcrumbs"; initBreadcrumbs();' > breadcrumbs.js
      - name: Bundle each entry and report gzipped sizes
        working-directory: /tmp/consumer
        run: |
          set -e
          npx esbuild core.js --bundle --minify --format=esm --outfile=out-core.js
          npx esbuild react.js --bundle --minify --format=esm --external:react --outfile=out-react.js
          npx esbuild server.js --bundle --minify --format=esm --platform=node --outfile=out-server.js
          npx esbuild ui.js --bundle --minify --format=esm --outfile=out-ui.js
          npx esbuild breadcrumbs.js --bundle --minify --format=esm --outfile=out-breadcrumbs.js
          for f in out-core out-react out-server out-ui out-breadcrumbs; do
            echo "$f: $(gzip -c $f.js | wc -c) bytes gzipped"
          done
          react=$(gzip -c out-react.js | wc -c)
          ui=$(gzip -c out-ui.js | wc -c)
          breadcrumbs=$(gzip -c out-breadcrumbs.js | wc -c)
          if [ "$react" -gt 4096 ]; then
            echo "bugbottle/react is $react bytes gzipped; the budget is 4096" >&2
            exit 1
          fi
          if [ "$ui" -gt 8192 ]; then
            echo "bugbottle/ui is $ui bytes gzipped; the budget is 8192" >&2
            exit 1
          fi
          # The breadcrumbs module itself is well under 1 kB; the rest of this
          # number is `buildSelector`, which is 471 bytes gzipped on its own and
          # is shared with the core in any app that also points at elements —
          # adding breadcrumbs to such an app costs about 550 bytes gzipped.
          if [ "$breadcrumbs" -gt 1536 ]; then
            echo "bugbottle/breadcrumbs is $breadcrumbs bytes gzipped; the budget is 1536" >&2
            exit 1
          fi
