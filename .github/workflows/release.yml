name: Release

# Publishes to npm when a version tag is pushed:
#   npm version minor          # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags
#
# Needs an NPM_TOKEN repository secret (granular access token, publish only,
# 2FA bypass enabled for automation). Provenance is attached so npm shows the
# package was built from this repository by this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refuse to publish if the tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
