# Replaces the stock /etc/nginx/conf.d/default.conf in the image.
#
# Two caching rules, because the two kinds of file age differently: the HTML
# and the stylesheet are revalidated on every visit, so a redeploy is visible
# at once, while /dist/ is the built library and is allowed to sit in the
# browser cache for an hour. Nothing here is content-hashed, so nothing is
# marked immutable.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # The page makes no external request; say so in a header as well.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # For the container platform. Cheap, unlogged, no dependency on the files.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The built library, copied in from the repository root at build time.
  location /dist/ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /style.css {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /demo.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # /da resolves to /da/index.html; anything unknown is a 404, not a rewrite —
  # this is two pages, not a single-page application.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ =404;
  }
}
