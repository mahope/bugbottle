# Replaces the stock /etc/nginx/conf.d/default.conf in the image.
#
# Two caching rules, because the two kinds of file age differently: the HTML
# and the stylesheet are revalidated on every visit, so a redeploy is visible
# at once, while /dist/ is the built library and is allowed to sit in the
# browser cache for an hour. Nothing here is content-hashed, so nothing is
# marked immutable.
#
# Every block below begins by including snippets/security-headers.conf. That
# is not decoration: nginx replaces the inherited `add_header` set as soon as a
# block adds a header of its own, so a location that sets `Cache-Control` and
# nothing else serves its files with no security headers at all. The snippet is
# the shared copy; see the comment at the top of site/security-headers.conf.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  # woff2 is already compressed; gzipping it again only costs CPU.
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_vary on;

  # The page makes no external request, and the Content-Security-Policy in the
  # snippet is what makes that a rule the browser enforces rather than a claim
  # in the footer. Nosniff, no referrer and the framing, base and form limits
  # ride along in the same file.
  include snippets/security-headers.conf;

  # For the container platform. Cheap, unlogged, no dependency on the files.
  location = /health {
    include snippets/security-headers.conf;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # For crawlers. Both are written by scripts/build-docs.mjs in the builder
  # stage, so neither can fall behind the pages. nginx would serve the sitemap
  # as text/xml from its mime.types; `types { }` empties the map for this
  # location so default_type wins and it goes out as application/xml.
  location = /robots.txt {
    include snippets/security-headers.conf;
    access_log off;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    include snippets/security-headers.conf;
    types { }
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # The JSON Schema for a report, generated into dist/ by the build and copied
  # in with the rest of it. It is served under its $id so a validator that
  # follows the identifier in a report finds the document it names, and with
  # CORS open because validating from another origin is the whole point.
  location = /schema/report.json {
    include snippets/security-headers.conf;
    alias /usr/share/nginx/html/dist/report.schema.json;
    default_type application/schema+json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  # The OpenAPI description of the report endpoint, generated from the schema
  # above and from handleReport's answers, and copied in with the rest of
  # dist/. Same rules as the schema: served under the address the document
  # names itself by, and with CORS open, because the tools that read it —
  # generators, linters, gateways — fetch it from somewhere else.
  location = /schema/openapi.json {
    include snippets/security-headers.conf;
    alias /usr/share/nginx/html/dist/openapi.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  # The webfonts. Their filenames carry the family and the weight rather than
  # a content hash, but a face only changes when it is deliberately replaced,
  # so a day in the browser cache is safe and saves the round trip that would
  # otherwise flash the fallback on every second visit.
  location /fonts/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # The built library, copied in from the repository root at build time.
  location /dist/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /style.css {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /demo.js {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # /da resolves to /da/index.html; anything unknown is a 404, not a rewrite —
  # this is two pages, not a single-page application.
  location / {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}

# The alias. bugbottle.mahoje.dk was the first address this site had, and it is
# attached to the same Dokploy application, so Traefik terminates its TLS and
# forwards the request here with the original `Host` — which is what makes an
# exact server_name catch it before the catch-all above, whatever order the two
# blocks are written in. Everything asked of it moves permanently to the same
# path on the canonical host, so bookmarks and whatever a crawler still
# remembers converge on one origin; the canonical links, the Open Graph URLs
# and the sitemap have named bugbottle.dev since 0.5.0.
#
# The health check is the exception. Dokploy polls /health for the application,
# and a redirect there would read as a failure and flap it, so this block
# answers that one path exactly as the canonical block does.
server {
  listen 80;
  listen [::]:80;
  server_name bugbottle.mahoje.dk;

  charset utf-8;
  server_tokens off;

  include snippets/security-headers.conf;

  location = /health {
    include snippets/security-headers.conf;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # $request_uri is the path and query as they arrived, so /docs/?q=x keeps
  # both halves. 301 rather than 308 because this is a GET-only site and the
  # older status is the one every crawler treats as canonical.
  location / {
    include snippets/security-headers.conf;
    return 301 https://bugbottle.dev$request_uri;
  }
}
