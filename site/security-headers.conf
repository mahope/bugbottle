# The security headers, in one place, because nginx does not merge them.
#
# `add_header` is inherited from the enclosing block only for as long as the
# inner block adds no header of its own: the moment a `location` sets one — a
# `Cache-Control`, say — it replaces the server-level set entirely rather than
# adding to it. Every location in nginx.conf sets a cache header, so every
# location silently lost `Referrer-Policy` until this file existed.
#
# site/Dockerfile copies this to /etc/nginx/snippets/, and the server block and
# every location inside it include it. A header added here reaches all of them;
# forgetting the include in a new location is the one remaining way to lose
# one, and putting it on the first line of every block makes that visible.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

# The no-external-request promise, enforced rather than asserted. The site is
# static, self-hosts its two typefaces and its copy of dist/, and speaks to
# nothing off-origin, so `default-src 'self'` costs nothing and turns the
# footer's claim into something a browser refuses to break.
#
# Two directives are wider than 'self', and both are the panel rather than the
# page. `img-src` allows `data:` because a screenshot arrives as a
# `data:image/png;base64,` URL and is shown in an <img> before it is sent, and
# the annotator exports the marked-up picture the same way. `style-src` allows
# 'unsafe-inline' because `bugbottle/ui` renders into a shadow root and puts
# its stylesheet there as a <style> element, and sets the host's position and
# the `--bb-*` custom properties through a style attribute; CSP judges both as
# inline style even inside a shadow root, and a policy without it leaves the
# panel unstyled. Nothing in site/*.html or the generated documentation has an
# inline style or an inline script, so this is the panel's cost alone — the
# pages would be served by `style-src 'self'` today.
#
# The three that are not about sources: `frame-ancestors 'none'` (nobody frames
# this site, which is also X-Frame-Options: DENY for the browsers that predate
# it), `base-uri 'self'` so an injected <base> cannot re-point every relative
# URL on the page, and `form-action 'self'` because the site posts nowhere.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
