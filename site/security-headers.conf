# The security headers, in one place, because nginx does not merge them.
#
# `add_header` is inherited from the enclosing block only for as long as the
# inner block adds no header of its own: the moment a `location` sets one — a
# `Cache-Control`, say — it replaces the server-level set entirely rather than
# adding to it. Every location in nginx.conf sets a cache header, so every
# location silently lost `Referrer-Policy` until this file existed.
#
# site/Dockerfile copies this to /etc/nginx/snippets/, and the server block and
# every location inside it include it. A header added here reaches all of them;
# forgetting the include in a new location is the one remaining way to lose
# one, and putting it on the first line of every block makes that visible.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
