name: 'Bugbottle Report Validator'
description: >
  Validate bug reports collected by the bugbottle browser widget inside a CI
  workflow — e.g. reports exported from your endpoint as JSON files in the
  repository or an artifact. Fails the job when a report is malformed, so bad
  data never reaches your issue tracker.
author: 'mahope'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  reports-glob:
    description: 'Glob pattern for JSON report files to validate (e.g. "reports/*.json").'
    required: true
  require-screenshot:
    description: 'Fail reports that carry no screenshot.'
    required: false
    default: 'false'
  max-report-size-kb:
    description: 'Fail any single report file larger than this (in KB).'
    required: false
    default: '4096'

outputs:
  valid-count:
    description: 'Number of valid reports found.'
  invalid-count:
    description: 'Number of invalid/malformed reports.'

runs:
  using: 'node20'
  main: 'index.cjs'
